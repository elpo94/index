<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @font-face {
      font-family: 'Cafe24Ssurround';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    }

    body {
      font-family: 'Cafe24Ssurround', sans-serif;
      background-color: #f0faff;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
      color: #333;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 123, 255, 0.15);
      width: 100%;
      max-width: 500px;
    }

    h2 { color: #007bff; text-align: center; margin-bottom: 30px; font-size: 1.6em; }

    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #444; font-size: 0.95em; }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e1e9ff;
      border-radius: 12px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1em;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, textarea:focus { border-color: #007bff; background-color: #fcfdff; }

    textarea { height: 120px; resize: none; }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Cafe24Ssurround';
      font-size: 1.2em;
      width: 100%;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover { background-color: #0056b3; transform: translateY(-2px); }
    button:disabled { background-color: #bddbff; cursor: not-allowed; }

    #loading { display: none; text-align: center; margin-top: 25px; color: #007bff; font-size: 0.9em; }
    
    #resultBox {
      display: none;
      margin-top: 30px;
      padding: 25px;
      background-color: #f5faff;
      border: 2px solid #e1efff;
      border-radius: 15px;
      line-height: 1.8;
      white-space: pre-wrap; /* 줄바꿈 유지 */
    }

    .feedback-title {
      display: block;
      color: #0056b3;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px dashed #007bff;
      padding-bottom: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>오늘의 마음 기록 💙</h2>
  
  <div class="input-group">
    <label>성함</label>
    <input type="text" id="name" placeholder="이름을 알려주세요">
  </div>

  <div class="input-group">
    <label>나의 MBTI</label>
    <select id="mbti">
      <option value="ISTJ">ISTJ</option><option value="ISFJ">ISFJ</option>
      <option value="INFJ">INFJ</option><option value="INTJ">INTJ</option>
      <option value="ISTP">ISTP</option><option value="ISFP">ISFP</option>
      <option value="INFP">INFP</option><option value="INTP">INTP</option>
      <option value="ESTP">ESTP</option><option value="ESFP">ESFP</option>
      <option value="ENFP">ENFP</option><option value="ENTP">ENTP</option>
      <option value="ESTJ">ESTJ</option><option value="ESFJ">ESFJ</option>
      <option value="ENFJ">ENFJ</option><option value="ENTJ">ENTJ</option>
    </select>
  </div>

  <div class="input-group">
    <label>오늘의 감정 키워드</label>
    <input type="text" id="emotion" placeholder="예: 행복함, 서운함, 뿌듯함 등">
  </div>

  <div class="input-group">
    <label>무슨 일이 있었나요? (자세히 적을수록 좋아요!)</label>
    <textarea id="reason" placeholder="선생님에게 말하듯 편하게 적어주세요."></textarea>
  </div>

  <button id="submitBtn" onclick="submitData()">AI 마음 처방전 받기</button>

  <div id="loading">AI 상담 선생님이 마음을 분석하고 있어요. 잠시만 기다려 주세요... ⏳</div>
  
  <div id="resultBox">
    <span class="feedback-title">📋 맞춤 마음 처방전</span>
    <div id="feedbackText"></div>
  </div>
</div>

<script>
  function submitData() {
    const name = document.getElementById('name').value;
    const mbti = document.getElementById('mbti').value;
    const emotion = document.getElementById('emotion').value;
    const reason = document.getElementById('reason').value;

    if(!name || !emotion || !reason) {
      alert("모든 칸을 채워주시면 더 정확한 상담이 가능해요!");
      return;
    }

    const btn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('resultBox');
    
    btn.disabled = true;
    loading.style.display = 'block';
    resultBox.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(feedback) {
        loading.style.display = 'none';
        btn.disabled = false;
        resultBox.style.display = 'block';
        document.getElementById('feedbackText').innerText = feedback;
      })
      .processStudentData({
        name: name,
        mbti: mbti,
        emotion: emotion,
        reason: reason
      });
  }
</script>

</body>
</html>
